<!doctype html>
<html lang="es">
<head>

<title>Final War pastel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #eef2ea; --fondo2: #f7f4ec; --tinta: #34434a; --suave: #7d8a8c; --linea: #e3e6dc;

    --coral: #e6806c; --coral-o: #c9624e; --oro: #b48a12; --oro-f: #fbedbc; --puntos: #4f84c4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #dfe3dc; font-family: Nunito, system-ui, sans-serif; color: var(--tinta); }
  .pagina { padding: 28px 16px 60px; }
  .pagina > h1 { text-align: center; font: 700 24px/1.2 Quicksand, sans-serif; margin: 0 0 4px; }
  .pagina > p { text-align: center; margin: 0 0 28px; color: #5e6a6c; }
  .fila { display: flex; gap: 36px; justify-content: center; flex-wrap: wrap; align-items: flex-start; }
  .opcion { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
  .opcion h2 { margin: 0; font: 700 18px/1 Quicksand, sans-serif; }
  .movil { width: 375px; max-width: calc(100vw - 32px); height: 800px; border-radius: 44px; border: 10px solid #1d2326; overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(29,35,38,.3); }
  /* variante "con más color" (25 oct): mismas formas, colores más firmes y más contraste */
  .fuerte {
    --tinta: #22313a; --suave: #5f6d72; --fondo: #e7ede4; --fondo2: #f3f1ea;
    --salvia-o: #3f8a5c; --cielo-o: #2f6fd0; --melocoton-o: #df5f3c; --lavanda-o: #6a4bd0; --mantequilla-o: #c48d00; --rosa-o: #cc3f6f;
    --coral: #e2553f; --coral-o: #b9402c; --oro: #a77800; --oro-f: #fde6a0; --puntos: #2f6fd0;
    --sombra: 0 10px 26px rgba(34, 49, 58, .12), 0 2px 6px rgba(34, 49, 58, .08);
  }
  .fuerte .pantalla { background: linear-gradient(180deg, #cfe6e0 0%, var(--fondo) 260px, var(--fondo2) 100%); }
  .fuerte .bola { color: #fff !important; }
  .fuerte .salvia { background: var(--salvia-o); } .fuerte .cielo { background: var(--cielo-o); } .fuerte .melocoton { background: var(--melocoton-o); }
  .fuerte .lavanda { background: var(--lavanda-o); } .fuerte .mantequilla { background: var(--mantequilla-o); } .fuerte .rosa { background: var(--rosa-o); }
  .fuerte .figura { background: radial-gradient(circle at 50% 38%, #ffd9cc, #f6a58c); }
  .fuerte .pista i { background: var(--puntos); }
  .fuerte .jugar { box-shadow: 0 10px 22px rgba(226,85,63,.35), inset 0 -4px 0 rgba(0,0,0,.12); }
  .fuerte .racha { background: #fde0d4; }
  .fuerte .elegir { background: var(--cielo-o); color: #fff; }
  .fuerte .nav a.on { background: var(--coral); color: #fff; }
  .fuerte .libres .num { background: var(--puntos); }
  .fuerte .logo span { color: var(--salvia-o); }
  /* variante "adulta" (25 oct): más color, sin el círculo detrás del héroe, títulos con serifa, menos redondeo */
  .adulta {
    --fondo: #e1e8de; --fondo2: #ece9e1; --tinta: #1f2c33; --suave: #56646a;
    --salvia-o: #2f7d4c; --cielo-o: #2a63c4; --melocoton-o: #d4502e; --lavanda-o: #5b3fc4; --mantequilla-o: #b88200; --rosa-o: #b8325f;
    --coral: #d4452f; --coral-o: #a8341f; --oro: #7a5600; --oro-f: #fbd769; --puntos: #2a63c4;
  }
  .adulta, .adulta .pantalla { font-family: Manrope, Nunito, sans-serif; }
  .adulta h3, .adulta h4, .adulta .logo b, .adulta .titulo, .adulta .jugar { font-family: Fraunces, Georgia, serif; letter-spacing: 0; }
  .adulta .pantalla { background: linear-gradient(180deg, #bcd9cd 0%, var(--fondo) 270px, var(--fondo2) 100%); }
  .adulta .logo b { font-size: 32px; }
  .adulta .tarjeta, .adulta .hueco { border-radius: 16px; }
  .adulta .jugar { border-radius: 14px; font-size: 22px; }
  .adulta .oro { border-radius: 10px; }
  .adulta .redondo { border-radius: 11px; }
  .adulta .avatar { border-radius: 10px; background: #f0d9c9; }
  .adulta .nav { border-radius: 20px; }
  .adulta .nav a { border-radius: 14px; }
  .adulta .pestanas { border-radius: 12px; } .adulta .pestanas a { border-radius: 9px; }
  .adulta .elegir { border-radius: 10px; }
  .adulta .racha { border-radius: 8px; }
  .adulta .figura { background: none !important; border-radius: 0; }
  .adulta .heroe .figura { width: 118px; height: 124px; }
  .adulta .heroe .figura svg { width: 118px; height: 124px; top: 0; }
  .adulta .grande .figura { width: 190px; height: 196px; }
  .adulta .grande .figura svg { width: 190px; height: 196px; top: 0; }
  .adulta .pista { border-radius: 4px; } .adulta .pista i { border-radius: 4px; }
  .b-verde { --coral: #2f8a57; --coral-o: #23704a; }
  .b-azul { --coral: #2a63c4; --coral-o: #1f4e9e; }
  .b-oscuro { --coral: #24323b; --coral-o: #24323b; }
  .b-verde .jugar { box-shadow: 0 10px 22px rgba(47,138,87,.32), inset 0 -4px 0 rgba(0,0,0,.14); }
  .b-azul .jugar { box-shadow: 0 10px 22px rgba(42,99,196,.32), inset 0 -4px 0 rgba(0,0,0,.14); }
  .b-oscuro .jugar { box-shadow: 0 10px 22px rgba(36,50,59,.30), inset 0 -4px 0 rgba(0,0,0,.25); }
  /* versión 2: los colores del juego actual (pergamino, burdeos, barra oscura) con esta misma estética */
  .v-juego { --fondo: #e4d8bd; --fondo2: #ddd0b2; --tinta: #2a2419; --suave: #6b6050; --papel: #fcf9f1;
    --coral: #8b1a1a; --coral-o: #8b1a1a; --oro: #7a5a00; --oro-f: #f3dc8f; --puntos: #2459b3;
    --salvia-o: #2e7d32; --cielo-o: #2459b3; --melocoton-o: #a8431f; --lavanda-o: #5b3b8c; --mantequilla-o: #9c7400; --rosa-o: #8b1a1a;
    --sombra: 0 6px 18px rgba(42,36,25,.12), 0 1px 0 rgba(179,160,122,.6); }

  .v-juego .nav { background: #2b2620; box-shadow: 0 10px 30px rgba(42,36,25,.3); }
  .v-juego .nav a { color: #b9ab8c; }
  .v-juego .nav a.on { background: rgba(255,210,74,.14); color: #ffd24a; }
  .v-juego .redondo { background: var(--papel); }
  .v-juego .logo span { color: #8b1a1a; }
  .v-juego .pista { background: #ece2cb; }
  /* versión 3: dibujos a color dentro de los círculos, en vez de iconos de línea */

  .v-ilus .modo .bola { width: 50px; height: 50px; }
  .v-ilus .bola svg { width: 34px !important; height: 34px !important; }
  /* versión 4: cabecera de atardecer */
  .v-tarde .pantalla { background: linear-gradient(180deg, #f6c58f 0%, #f3d6a9 90px, #e7e3cf 200px, var(--fondo) 270px, var(--fondo2) 100%); }
  .v-tarde .logo span { color: #a8431f; }
  .pantalla { height: 100%; overflow-y: auto; scrollbar-width: none; background: linear-gradient(180deg, #dcebe6 0%, var(--fondo) 260px, var(--fondo2) 100%); display: flex; flex-direction: column; }
  .pantalla::-webkit-scrollbar { display: none; }
  .pantalla > * { flex-shrink: 0; }
  .cuerpo { padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  h3, h4, .logo b, .titulo { font-family: Quicksand, sans-serif; }

  /* cabecera: islita de hexágonos */
  .isla { position: relative; height: 178px; }
  .isla svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .logo { position: absolute; left: 0; right: 0; top: 18px; text-align: center; }
  .logo b { display: block; font-size: 30px; font-weight: 700; letter-spacing: .5px; color: var(--tinta); }
  .logo span { display: block; font-size: 11px; font-weight: 800; letter-spacing: 5px; color: var(--salvia-o); margin-top: 2px; }

  .cuenta { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #fde3d6; overflow: hidden; }
  .cuenta .nombre { font-weight: 800; }
  .cuenta .nivel { color: var(--suave); font-weight: 700; font-size: 13px; }
  .esp { flex: 1; }
  .oro { display: inline-flex; align-items: center; gap: 5px; background: var(--oro-f); color: var(--oro); font-weight: 800; padding: 5px 11px 5px 6px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  .redondo { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--papel); box-shadow: var(--sombra); display: grid; place-items: center; color: var(--tinta); }

  .tarjeta { background: var(--papel); border-radius: 26px; box-shadow: var(--sombra); }
  .heroe { padding: 16px; display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
  .figura { width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #ffeee6, #fbd6c6); display: grid; place-items: center; }
  .figura svg { width: 100px; height: 100px; position: relative; top: 4px; }
  .fac { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--coral-o); }
  .fac svg { width: 15px; height: 17px; }
  .heroe h3 { margin: 3px 0 2px; font-size: 24px; font-weight: 700; line-height: 1.05; }
  .rango { font-size: 13px; font-weight: 700; color: var(--suave); }
  .barra { margin-top: 10px; }
  .pista { height: 8px; border-radius: 99px; background: #edf0ea; overflow: hidden; }
  .pista i { display: block; height: 100%; width: 87%; border-radius: 99px; background: var(--cielo); }
  .barra .txt { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--suave); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .puntos { color: var(--puntos); font-weight: 800; }

  .jugar { width: 100%; border: 0; border-radius: 99px; background: var(--coral); color: #fff; padding: 17px 10px; font: 700 21px Quicksand, sans-serif; box-shadow: 0 10px 22px rgba(230,128,108,.35); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .jugar small { font: 700 13px Nunito, sans-serif; opacity: .85; }
  .enlace { text-align: center; font-size: 14px; font-weight: 700; color: var(--suave); margin-top: -4px; }

  .misiones { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .bola { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .misiones b { display: block; font-weight: 800; }
  .misiones small { color: var(--suave); font-weight: 700; }
  .puntitos { display: flex; gap: 4px; margin-left: auto; }

  .racha { font-size: 13px; font-weight: 800; color: var(--melocoton-o); background: #fdebe3; padding: 5px 10px; border-radius: 99px; }

  .seccion { font-size: 13px; font-weight: 800; color: var(--suave); margin: 4px 4px -6px; }
  .modos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modo { padding: 14px; min-height: 132px; display: flex; flex-direction: column; }
  .modo .bola { width: 44px; height: 44px; }
  .modo h4 { margin: 12px 0 2px; font-size: 18px; font-weight: 700; line-height: 1.1; }
  .modo p { margin: 0; font-size: 12.5px; line-height: 1.3; color: var(--suave); font-weight: 600; }
  .modo .meta { margin-top: auto; padding-top: 8px; font-size: 12px; font-weight: 800; }
  .salvia { background: #e3f0e6; color: var(--salvia-o); } .cielo { background: #e1ecf8; color: var(--cielo-o); }
  .melocoton { background: #fde7dd; color: var(--melocoton-o); } .lavanda { background: #ece6f8; color: var(--lavanda-o); }
  .mantequilla { background: #fbf2d2; color: var(--mantequilla-o); } .rosa { background: #fbe4ea; color: var(--rosa-o); }
  .tm-salvia { color: var(--salvia-o); } .tm-cielo { color: var(--cielo-o); } .tm-melocoton { color: var(--melocoton-o); } .tm-lavanda { color: var(--lavanda-o); } .tm-mantequilla { color: var(--mantequilla-o); } .tm-rosa { color: var(--rosa-o); }

  .nav { position: sticky; bottom: 12px; margin: 6px 14px 12px; background: var(--papel); border-radius: 99px; box-shadow: 0 10px 30px rgba(52,67,74,.16); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 99px; font-size: 11.5px; font-weight: 800; color: #9aa4a5; text-decoration: none; }
  .nav a svg { width: 22px; height: 22px; }
  .nav a.on { background: #fdebe6; color: var(--coral-o); }

  /* pantalla del héroe */
  .cab { display: flex; align-items: center; gap: 10px; padding: 18px 2px 4px; }
  .cab .titulo { font-size: 26px; font-weight: 700; flex: 1; }
  .grande { padding: 18px 16px 16px; text-align: center; }
  .grande .figura { width: 168px; height: 168px; margin: 0 auto 8px; }
  .grande .figura svg { width: 150px; height: 150px; }
  .grande h3 { margin: 4px 0 2px; font-size: 28px; font-weight: 700; }
  .grande .fac { justify-content: center; }
  .grande .rasgo { margin: 6px auto 0; max-width: 30ch; font-size: 13px; color: var(--suave); font-weight: 600; }
  .huecos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .hueco { background: var(--papel); border-radius: 20px; box-shadow: var(--sombra); padding: 10px 6px; text-align: center; min-height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .hueco .bola { width: 38px; height: 38px; }
  .hueco b { font-size: 12.5px; }
  .hueco small { font-size: 11px; color: var(--suave); font-weight: 700; }
  .hueco.vacio { background: transparent; box-shadow: none; border: 2px dashed #d9ded4; }
  .pestanas { display: grid; grid-template-columns: repeat(4, 1fr); background: #e6ebe2; border-radius: 99px; padding: 4px; }
  .pestanas a { text-align: center; font-size: 13px; font-weight: 800; color: var(--suave); padding: 8px 0; border-radius: 99px; }
  .pestanas a.on { background: var(--papel); color: var(--tinta); box-shadow: 0 2px 8px rgba(52,67,74,.10); }
  .mejora { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .mejora .txt { flex: 1; }
  .mejora b { display: block; font-size: 15px; }
  .mejora small { color: var(--suave); font-weight: 600; font-size: 12.5px; }
  .peld { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .peld i { width: 7px; height: 7px; border-radius: 50%; background: #e3e7df; }
  .peld i.si { background: var(--salvia-o); }
  .elegir { border: 0; border-radius: 99px; padding: 8px 14px; font: 800 13px Nunito, sans-serif; background: #e1ecf8; color: var(--cielo-o); }
  .cambio-f { margin-top: 7px; font-size: 12px; font-weight: 800; color: var(--cielo-o); }
  .tope { font-size: 12px; font-weight: 800; color: var(--suave); }
  .libres { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .libres .num { width: 30px; height: 30px; border-radius: 50%; background: var(--cielo-o); color: #fff; display: grid; place-items: center; font-size: 15px; }
</style>
</head>

  <p>Todas sobre la base guardada, con un castillo pequeño en la islita en vez de la casa.</p>

</div>

  const bucle = (ahora) => { const t = (ahora - t0) / 1000; banderas.forEach(b => pintar(b, t)); if (!quieto) requestAnimationFrame(bucle); };
  requestAnimationFrame(bucle);
})();
</script>
