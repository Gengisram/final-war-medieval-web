  <g stroke="#1b1726" stroke-width="${o}" stroke-linejoin="round" stroke-linecap="round">
    <path d="M86 92 L108 30" stroke-width="${o + 7}"/><path d="M86 92 L108 30" stroke="#dfe6ee" stroke-width="${o + 2}"/>
    <path d="M78 86 L96 96" stroke="#f2b90f" stroke-width="${o + 3}"/>
    <rect x="36" y="68" width="48" height="36" rx="14" fill="#2f6fd6"/>
    <rect x="36" y="86" width="48" height="7" fill="#7a4a24" stroke-width="${o - 1}"/>
    <ellipse cx="47" cy="108" rx="10" ry="7" fill="#2b2433"/><ellipse cx="73" cy="108" rx="10" ry="7" fill="#2b2433"/>
    <circle cx="60" cy="48" r="27" fill="#f8d0aa"/>
    <path d="M33 47a27 27 0 0 1 54 0z" fill="#d93a3a"/>
    <rect x="30" y="43" width="60" height="8" rx="4" fill="#a82626"/>
    <circle cx="30" cy="86" r="13" fill="#d93a3a"/><circle cx="30" cy="86" r="5" fill="#f2b90f" stroke-width="${o - 1.5}"/>
  </g>
  <circle cx="51" cy="57" r="3.6" fill="#1b1726"/><circle cx="69" cy="57" r="3.6" fill="#1b1726"/>
  <circle cx="44" cy="64" r="4.5" fill="#f59a9a" opacity=".7"/><circle cx="76" cy="64" r="4.5" fill="#f59a9a" opacity=".7"/>
  <path d="M53 66q7 6 14 0" stroke="#1b1726" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;
const paisaje = `<svg class="paisaje" viewBox="0 0 375 110" preserveAspectRatio="none">
  <path d="M0 70 Q60 40 120 62 T240 52 T375 60 V110 H0Z" fill="#4c66a8" opacity=".55"/>
  <g fill="#3a5291" opacity=".9"><rect x="262" y="26" width="14" height="40"/><rect x="286" y="34" width="22" height="32"/><rect x="312" y="22" width="14" height="44"/><path d="M262 26h3v-5h3v5h2v-5h3v5h3M312 22h3v-5h3v5h2v-5h3v5h3"/></g>
  <path d="M0 88 Q90 66 190 84 T375 78 V110 H0Z" fill="#eef1f7"/>
</svg>`;

function pantalla(t) {
  const modos = [
    ["m1", "bandera", "Campaña", "Siete historias, diez mapas cada una", "0 de 10 mapas"],
    ["m2", "espadas", "Batalla", "Móntala tú: tipo, rivales y equipos", "Sin récord todavía"],
    ["m3", "castillo", "Grandes batallas", "Europa, la Península, Britannia", "Tres mapas grandes"],
    ["m4", "duelo", "Duelo online", "Uno contra uno, en directo", "En directo"],
  ];
  const semana = [
    ["m5", "mapa", "Mapa del día", "El mismo mapa para todo el mundo", "Hoy: Castilla o mongoles"],
    ["m6", "laurel", "Batalla semanal", "Hastings, 1066", "Cambia en 4 días"],
  ];
  const tile = ([c, ic, h, p, m]) => `<div class="modo ${c}"><div class="ic">${S(IC[ic], 'width="22" height="22"')}</div><h4>${h}</h4><p>${p}</p><div class="meta">${m}</div>${S(IC[ic], 'class="marca" stroke-width="1.6"')}</div>`;
  const cuenta = `<div class="cuenta"><div class="avatar" style="background:${t === "B" ? "#ffe2e2" : t === "A" ? "#c8243c" : "#d6243c"}">${heroe(5)}</div><span class="nombre">rod</span><span class="nivel">Nv. 5</span><span class="esp"></span><span class="oro">${moneda}376</span><button class="tienda" aria-label="Tienda">${S(IC.bolsa, 'width="19" height="19"')}</button></div>`;
  const logo = `<div class="logo"><b>Final War</b><span>MEDIEVAL</span></div>`;
  const cuerpo = `
    <div class="heroe">
      <div class="figura">${heroe(t === "B" ? 3.5 : 4)}</div>
      <div>
        <div class="fac">${escudoCastilla}Corona de Castilla</div>
        <h3>Alfonso VIII</h3>
        <span class="rango">${S(IC.estrella, 'width="14" height="14" fill="currentColor" stroke-width="1"')}Sargento</span>
        <div class="barra"><div class="pista"><i></i></div><div class="txt"><span><span class="puntos">3652</span> / 4200</span><span>→ Caballero</span></div></div>
        <div class="cambio">Cambiar facción ›</div>
      </div>
    </div>
    <button class="jugar"><b>Partida rápida</b><small>3 rivales · 15 turnos</small></button>
    <div class="enlace">Elegir rivales, tamaño y reglas ›</div>
    <div class="misiones">
      <div class="ico">${S(IC.diana, 'width="22" height="22"')}</div>
      <div class="txt"><b>Misiones de hoy</b><small>0 de 3 · hasta 26 de oro</small><div class="segs"><i></i><i></i><i></i></div></div>
      <span class="racha">${S(IC.llama, 'width="15" height="15"')}3 días</span>
    </div>
    <div class="seccion">Modos de juego</div>
    <div class="modos">${modos.map(tile).join("")}</div>
    <div class="seccion">Esta semana</div>
    <div class="modos">${semana.map(tile).join("")}</div>`;
  const nav = `<nav class="nav">${[["espadas", "Jugar", 1], ["escudo", "Héroe"], ["bolsa", "Tienda"], ["laurel", "Ranking"]].map(([i, n, on]) => `<a href="#" class="${on ? "on" : ""}">${S(IC[i])}${n}</a>`).join("")}</nav>`;
  if (t === "C") return `<div class="pantalla"><div class="cabeza">${logo}${cuenta}${paisaje}</div><div class="cuerpo">${cuerpo}</div>${nav}</div>`;
  return `<div class="pantalla"><div class="cuerpo">${logo}${cuenta}${cuerpo}</div>${nav}</div>`;
}
const opciones = [
  ["A", "A · Noche de batalla", "Fondo azul noche, colores saturados, botón verde de jugar"],
  ["B", "B · Día de torneo", "Claro y luminoso, tarjetas blancas, botón naranja"],
  ["C", "C · Estandarte", "Cabecera nocturna con paisaje y cuerpo claro, rojo de Castilla"],
];
document.getElementById("fila").innerHTML = opciones.map(([t, h, s]) => `<div class="opcion"><h2>${h}<small>${s}</small></h2><div class="movil t${t}">${pantalla(t)}</div></div>`).join("");
</script>
</body>
</html>
